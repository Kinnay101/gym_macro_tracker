<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Sicherheit: Verbindungen nur zur eigenen Adresse und zu Open Food Facts (Produktdaten, nur Suchbegriff/Barcode).
       'wasm-unsafe-eval' braucht der Barcode-Scanner (vendor/zxing). Später kommt Supabase (Sync) dazu. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://world.openfoodfacts.org https://ch.openfoodfacts.org; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Gym Macro Tracker</title>
  <meta name="description" content="Training und Ernährung tracken – für dich und deine Freunde.">
  <meta name="theme-color" content="#0E0F11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main class="main" id="view" tabindex="-1"></main>
    <nav class="nav" id="nav" aria-label="Hauptnavigation">
      <a href="#/today" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span data-t="nav.today">Heute</span>
      </a>
      <a href="#/food" data-tab="food">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2.5 1-4 3.5-4 7v3h4"/></svg>
        <span data-t="nav.food">Ernährung</span>
      </a>
      <a href="#/training" data-tab="training">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
        <span data-t="nav.training">Training</span>
      </a>
      <a href="#/progress" data-tab="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        <span data-t="nav.progress">Fortschritt</span>
      </a>
      <a href="#/body" data-tab="body">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span data-t="nav.body">Körper</span>
      </a>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
